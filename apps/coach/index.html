<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach — Micron OS</title>
<style>
  :root{
    --cave:#0A0E14; --panel:#10161F; --panel-2:#0D1219; --line:#1C2633;
    --line-bright:#2A3A4F; --ink:#C9D4E3; --ink-dim:#6B7A8F;
    --brass:#C8A24A; --brass-dim:#8A7239; --ok:#6FA86F;
    --serif:Georgia,'Times New Roman',serif; --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--cave);color:var(--ink);font:15px/1.6 var(--sans);display:flex}
  aside{width:250px;background:var(--panel-2);border-right:1px solid var(--line);
        padding:16px 14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
  h1{font-family:var(--serif);font-size:15px;letter-spacing:.3em;text-transform:uppercase;
     color:var(--brass);font-weight:400}
  h2{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-dim);
     text-transform:uppercase;font-weight:400}
  .card{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:11px 12px}
  label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--ink-dim);display:block;margin:8px 0 3px}
  select,input{width:100%;background:var(--cave);border:1px solid var(--line);color:var(--ink);
        padding:7px 9px;border-radius:3px;font-size:13px}
  select:focus,input:focus{outline:none;border-color:var(--brass-dim)}
  button{background:none;border:1px solid var(--line-bright);color:var(--ink);
         font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
         padding:7px 10px;border-radius:3px;cursor:pointer}
  button:hover{border-color:var(--brass-dim);color:var(--brass)}
  button.primary{border-color:var(--brass-dim);color:var(--brass)}
  button:disabled{opacity:.35;cursor:default}
  #streak{font-family:var(--mono);font-size:12px;color:var(--ok);letter-spacing:.08em}
  .hist{border-left:2px solid var(--line-bright);padding:4px 9px;margin:4px 0;font-size:12.5px}
  .hist .d{font-family:var(--mono);font-size:10px;color:var(--ink-dim)}
  .empty{color:var(--ink-dim);font-style:italic;font-size:12.5px}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar{display:flex;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line);
       align-items:center;flex-wrap:wrap}
  #timer{font-family:var(--mono);font-size:14px;color:var(--brass);margin-left:auto;min-width:52px;text-align:right}
  #log{flex:1;overflow-y:auto;padding:20px 22px}
  .turn{max-width:74ch;margin-bottom:18px}
  .turn .who{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
             text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px}
  .turn.coach{border-left:2px solid var(--brass);padding-left:14px}
  .turn.coach .who{color:var(--brass)}
  .turn.you{margin-left:auto;text-align:right}
  .turn .body{white-space:pre-wrap}
  #thinking{display:none;color:var(--ink-dim);font-family:var(--mono);font-size:13px;padding:0 22px 8px}
  #thinking.on{display:block}
  form{display:flex;gap:10px;padding:12px 22px 18px;border-top:1px solid var(--line)}
  #msg{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
       padding:10px 13px;font:15px var(--sans);border-radius:3px;resize:none;height:44px}
  #msg:focus{outline:none;border-color:var(--brass-dim)}
</style>
</head>
<body>
<aside>
  <h1>Coach</h1>
  <div class="card">
    <h2>About you</h2>
    <label>Goal</label>
    <select id="goal">
      <option value="general fitness">General fitness</option>
      <option value="build strength">Build strength</option>
      <option value="build muscle">Build muscle</option>
      <option value="lose fat">Lose fat</option>
      <option value="endurance">Endurance</option>
    </select>
    <label>Equipment</label>
    <input id="equip" placeholder="e.g. none / dumbbells / full gym">
    <label>Days per week</label>
    <select id="days"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
    <label>Anything to work around?</label>
    <input id="limits" placeholder="e.g. bad knee, no jumping">
  </div>
  <div class="card">
    <h2>Record</h2>
    <div id="streak">no sessions yet</div>
  </div>
  <h2>History</h2>
  <div id="history"><div class="empty">Nothing logged yet.</div></div>
</aside>

<main>
  <div id="bar">
    <button id="plan" class="primary">Plan today's session</button>
    <button id="done">I finished — log it</button>
    <button data-t="60">Rest 60s</button>
    <button data-t="90">Rest 90s</button>
    <span id="timer"></span>
  </div>
  <div id="log">
    <div class="turn coach"><div class="who">Coach</div>
    <div class="body">Fill in the panel on the left — goal, what you've got, how often — then ask me to plan today's session. Tell me honestly what you can do; the plan is only as good as the truth it's built on.</div></div>
  </div>
  <div id="thinking">thinking…</div>
  <form id="composer">
    <textarea id="msg" placeholder="How did the last set feel? Ask about form, swaps, soreness…"></textarea>
    <button id="send" type="submit" class="primary">Send</button>
  </form>
</main>

<script>
// The Coach: Alfred with a whistle. Same brain via /api/chat; this app holds
// what he cannot - your profile, your log, your streak - and hands it to him
// with every message, so today's plan knows about yesterday's squats.
let state = {profile: {goal:'general fitness', equip:'', days:'4', limits:''}, log: []};
let running = false;

const FRAME = () => {
  const p = state.profile;
  const recent = state.log.slice(-6).map(l => l.date + ': ' + l.summary).join('\n');
  return '[Workout coach session]\n'+
    'You are a supportive, no-nonsense fitness coach. Goal: ' + p.goal +
    '. Equipment: ' + (p.equip || 'none stated') + '. Training days/week: ' + p.days +
    '. Limitations to respect: ' + (p.limits || 'none stated') + '.\n'+
    'Rules: sessions 30-45 minutes with a warmup; give sets x reps and a form '+
    'cue for each exercise; only use the stated equipment; respect the stated '+
    'limitations absolutely; progress gradually from the recent log; if pain '+
    '(not soreness) is mentioned, say to stop and see a professional - you '+
    'coach fitness, you do not treat injuries.\n'+
    (recent ? 'Recent sessions:\n' + recent + '\n' : 'No sessions logged yet.\n');
};

async function load(){
  try{
    const d = await (await fetch('/api/appdata/coach')).json();
    if (d && d.profile) state = d;
  }catch(e){}
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => fetch('/api/appdata/coach', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(state)}).catch(()=>{}), 400);
}

const log = document.getElementById('log');
function turn(who, text){
  const el = document.createElement('div');
  el.className = 'turn ' + (who === 'Coach' ? 'coach' : 'you');
  el.innerHTML = '<div class="who"></div><div class="body"></div>';
  el.querySelector('.who').textContent = who;
  el.querySelector('.body').textContent = text;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
}

async function ask(action, userShown){
  if (running) return;
  if (userShown) turn('You', userShown);
  running = true;
  document.getElementById('thinking').classList.add('on');
  for (const id of ['plan','done','send']) document.getElementById(id).disabled = true;
  try{
    const r = await fetch('/api/chat', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: FRAME() + action})});
    const d = await r.json();
    turn('Coach', d.reply || ('Something went wrong: ' + (d.error || 'unknown')));
  }catch(err){ turn('Coach', 'I could not reach my own core: ' + err.message); }
  finally{
    running = false;
    document.getElementById('thinking').classList.remove('on');
    for (const id of ['plan','done','send']) document.getElementById(id).disabled = false;
  }
}

document.getElementById('plan').onclick = () => {
  syncProfile();
  ask("Plan today's session. Warmup first, then the work, sets x reps, one form cue per exercise, and roughly how long it should take.");
};
document.getElementById('done').onclick = () => {
  const summary = (document.getElementById('msg').value.trim())
    || prompt_free();
  if (!summary) return;
  document.getElementById('msg').value = '';
  state.log.push({date: new Date().toISOString().slice(0,10), summary: summary.slice(0,200)});
  state.log = state.log.slice(-60);
  save(); renderRecord();
  ask('The student finished and logged: "' + summary + '". Acknowledge briefly, note one thing to carry into next time, and say when the next session should be given ' + state.profile.days + ' days/week.', '(logged: ' + summary + ')');
};
function prompt_free(){
  // no prompt() riddles in this house: nudge them to type it instead
  turn('Coach', 'Type what you did into the message box first (e.g. "full session as planned" or "squats + pushups, skipped the run"), then press the log button again.');
  return null;
}

document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = document.getElementById('msg').value.trim(); if (!text) return;
  document.getElementById('msg').value = '';
  syncProfile();
  ask('The student says: ' + text, text);
});
document.getElementById('msg').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault();
    document.getElementById('composer').requestSubmit(); }
});

// rest timers - the one thing a coach app must do without thinking
let tick = null;
document.querySelectorAll('button[data-t]').forEach(b => {
  b.onclick = () => {
    clearInterval(tick);
    let left = parseInt(b.dataset.t, 10);
    const t = document.getElementById('timer');
    t.textContent = left + 's';
    tick = setInterval(() => {
      left -= 1;
      t.textContent = left > 0 ? left + 's' : 'go';
      if (left <= 0){ clearInterval(tick); setTimeout(() => t.textContent = '', 4000); }
    }, 1000);
  };
});

// profile + record
function syncProfile(){
  state.profile = {
    goal: document.getElementById('goal').value,
    equip: document.getElementById('equip').value.trim(),
    days: document.getElementById('days').value,
    limits: document.getElementById('limits').value.trim(),
  };
  save();
}
for (const id of ['goal','equip','days','limits'])
  document.getElementById(id).addEventListener('change', syncProfile);

function renderRecord(){
  const streakEl = document.getElementById('streak');
  const dates = [...new Set(state.log.map(l => l.date))].sort().reverse();
  if (!dates.length){ streakEl.textContent = 'no sessions yet'; }
  else {
    let streak = 0;
    let day = new Date();
    for (;;){
      const key = day.toISOString().slice(0,10);
      if (dates.includes(key)) { streak++; day.setDate(day.getDate()-1); }
      else if (streak === 0) { day.setDate(day.getDate()-1); // today not done yet - check yesterday
        const y = day.toISOString().slice(0,10);
        if (dates.includes(y)) { streak++; day.setDate(day.getDate()-1); } else break;
      } else break;
    }
    streakEl.textContent = state.log.length + ' sessions logged' +
      (streak > 1 ? ' · ' + streak + '-day streak' : '');
  }
  const h = document.getElementById('history'); h.replaceChildren();
  if (!state.log.length) h.innerHTML = '<div class="empty">Nothing logged yet.</div>';
  for (const l of [...state.log].reverse().slice(0,20)){
    const el = document.createElement('div'); el.className = 'hist';
    el.innerHTML = '<div class="d"></div><div class="s"></div>';
    el.querySelector('.d').textContent = l.date;
    el.querySelector('.s').textContent = l.summary;
    h.appendChild(el);
  }
}

load().then(() => {
  const p = state.profile;
  document.getElementById('goal').value = p.goal || 'general fitness';
  document.getElementById('equip').value = p.equip || '';
  document.getElementById('days').value = p.days || '4';
  document.getElementById('limits').value = p.limits || '';
  renderRecord();
});
</script>
</body>
</html>
