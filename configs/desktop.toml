# DESKTOP — Alfred core + fallback worker. The only machine running run_core.py.
#
# 8GB VRAM. That fits a 7B model at Q4 and nothing larger without spilling to
# CPU. Alfred's model does planning and synthesis — the two jobs that cannot
# be delegated — so this is where the constraint bites hardest.

[bus]
kind = "local"          # phase 1: one process, no server
# kind = "nats"
# url  = "nats://alfredpi.local:4222"

[core]
state_db     = "~/.alfred/state.db"
artifact_dir = "~/.alfred/artifacts"  # phase 1: local
# artifact_dir = "/mnt/alfred"        # phase 2: NFS mount from the Pi
fallback_after_s = 20
supervisor_tick_s = 30

# Fully local. Honest expectation: a 7B planner will occasionally produce a
# poor decomposition. The planner validates and retries, so this degrades
# into "handled without delegation" rather than into nonsense.
provider   = "ollama"
model      = "qwen2.5:7b"
ollama_url = "http://127.0.0.1:11434"
vision_model = "llava:7b"   # ollama pull llava:7b — the eyes; loaded on demand

# --- speed tuning for an 8GB card, all local ---
keep_alive  = "30m"    # hold the model in VRAM between messages ("-1" = forever)
num_ctx     = 4096     # context window; smaller is faster and ample for chat
num_predict = 1024     # cap reply length; raise for long technical answers

# Alternative: keep every worker local and let only planning and synthesis
# call out. A few hundred tokens a few times an hour. Set the key in the
# environment, never here — this file goes in git.
# provider     = "openai"
# api_base     = "https://api.openai.com/v1"
# model        = "gpt-4o-mini"
# api_key_env  = "ALFRED_API_KEY"

[worker]
id = "desktop"
concurrency = 1          # 1, not 2: the worker shares the GPU with Alfred
claim_delay_s = 0        # raise to ~15 once the Zenbook is on the bus
capabilities = [
    "code.write", "code.test", "calc.engineering",
    "research.web", "research.document", "docs.write",
    "cad.measure", "cad.variables", "cad.export", "cad.evaluate",
    "cad.generate", "cad.inspect",
    "os.observe", "os.apply",
    "media.inspect",
    # Eyes, parked for later. When ready:  ollama pull llava:7b
    # then uncomment:  "vision.describe", "media.video",
]

[research]
searxng_url = "http://alfredpi.local:8888"

# Ids Alfred should assume unless a task overrides them.
# Find them in the Onshape URL:
#   /documents/{document_id}/w/{workspace_id}/e/{element_id}
[onshape]
document_id       = ""
workspace_id      = ""
part_studio_id    = ""
variable_studio_id = ""
