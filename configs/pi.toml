# RASPBERRY PI — hardware gateway, control plane, and now CAD.
# Also runs: nats-server -js, mosquitto, searxng, and the NFS export.
#
# cad.* lives here because Onshape is a cloud API: the handler is an HTTPS
# client with no local CAD software and no GPU. There is no reason to spend
# the Zenbook's cycles on an HTTP request.

[bus]
kind = "nats"
url  = "nats://127.0.0.1:4222"

[core]
artifact_dir = "/srv/alfred"          # exported over NFS as /mnt/alfred

[worker]
id = "pi"
concurrency = 2
capabilities = ["hw.mqtt", "hw.sensor", "cad.measure", "cad.variables", "cad.export", "cad.evaluate"]

[hardware]
mqtt_host = "127.0.0.1"
mqtt_port = 1883

[onshape]
document_id       = ""
workspace_id      = ""
part_studio_id    = ""
variable_studio_id = ""
