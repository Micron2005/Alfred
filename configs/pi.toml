# RASPBERRY PI — hardware gateway, control plane, CAD client, and the
# household's voice: speech-to-text and text-to-speech live here.
# Also runs: nats-server -js, mosquitto, searxng, and the NFS export.
#
# cad.* lives here because Onshape is a cloud API: the handler is an HTTPS
# client with no local CAD software and no GPU. There is no reason to spend
# the Zenbook's cycles on an HTTP request.

[bus]
kind = "nats"
url  = "nats://127.0.0.1:4222"

[core]
artifact_dir = "/srv/alfred"          # exported over NFS as /mnt/alfred

[worker]
id = "pi"
concurrency = 2
capabilities = [
    "hw.mqtt", "hw.sensor",
    "cad.measure", "cad.variables", "cad.export", "cad.evaluate",
    # The household's ears and mouth. Piper was designed for this board.
    #   pip install faster-whisper piper-tts --break-system-packages
    "speech.transcribe", "speech.synthesize",
]

[hardware]
mqtt_host = "127.0.0.1"
mqtt_port = 1883

[onshape]
document_id       = ""
workspace_id      = ""
part_studio_id    = ""
variable_studio_id = ""
