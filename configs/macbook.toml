# OLD MACBOOK — research node. Runs no model of its own.
#
# It fetches and parses locally (cheap, network-bound) and sends the text to
# the desktop's Ollama for extraction. Note the model matches the desktop's
# exactly: on an 8GB card, asking for a second model makes Ollama evict and
# reload between every request, and that thrash costs far more than the
# inference itself.

[bus]
kind = "nats"
url  = "nats://alfredpi.local:4222"

[core]
artifact_dir = "/mnt/alfred"
provider   = "ollama"
model      = "qwen2.5:7b"                     # same as desktop, deliberately
ollama_url = "http://alfreddesktop.local:11434"

[worker]
id = "macbook"
concurrency = 2                                # network-bound, overlap is free
capabilities = ["research.web", "research.document"]

[research]
searxng_url = "http://alfredpi.local:8888"
