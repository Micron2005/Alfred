# CHROMEBOOK — dashboard host, light documentation. Runs no model.
# Needs Crostini for the worker; the dashboard is only a browser tab.
# Holds no state: it is off whenever the lid is closed, so it gets only
# work that nothing else is waiting on.

[bus]
kind = "nats"
url  = "nats://alfredpi.local:4222"

[core]
artifact_dir = "/mnt/alfred"
provider   = "ollama"
model      = "qwen2.5:7b"                     # same as desktop, deliberately
ollama_url = "http://alfreddesktop.local:11434"

[worker]
id = "chromebook"
concurrency = 1
capabilities = ["docs.write"]
